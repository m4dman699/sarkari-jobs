<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Jobs — SarkariJobs+</title>
  <meta name="description" content="Government job notifications by category — UPSC, SSC, Banking, Railways and more.">
  <link rel="canonical" href="https://sarkarijobsplus.com/category.html">
  <script src="js/analytics-config.js"></script>
  <script src="js/analytics.js" defer></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="tricolor-strip"></div>

  <header>
    <div class="container nav-wrap">
      <a class="logo" href="index.html">
        <span class="logo-flag"></span>
        Sarkari<span style="color:var(--saffron)">Jobs</span><span style="color:var(--green)">+</span>
      </a>
      <nav>
        <ul>
          <li><a href="index.html#map">States</a></li>
          <li><a href="index.html#categories">Categories</a></li>
          <li><a href="index.html#jobs">Notifications</a></li>
        </ul>
      </nav>
      <a class="btn btn-primary" href="index.html#jobs">Browse jobs</a>
    </div>
  </header>

  <section class="detail-hero">
    <div class="container">
      <a class="crumb" href="index.html">← Back to all categories</a>
      <h1 id="cat-title">Loading…</h1>
      <p class="desc" id="cat-desc"></p>
    </div>
  </section>

  <section class="block">
    <div class="container">
      <div class="section-head">
        <h2 id="jobs-heading">Notifications</h2>
        <div class="line"></div>
        <p>Dates and source links are shown when supplied in the feed.</p>
      </div>
      <div class="jobs-grid" id="cat-jobs-grid"></div>
    </div>
  </section>

  <footer>
    <div class="foot-bottom container">
      © <span data-current-year></span> SarkariJobs+ · Verify every notice on the relevant official government website before applying.
    </div>
    <div class="foot-strip"></div>
  </footer>

  <script src="js/states-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    function renderCategoryPage() {
      // hash-based routing (survives clean-URL redirects); fall back to ?c=
      const encodedName = window.location.hash.slice(1) ||
        new URLSearchParams(window.location.search).get('c') || '';
      let name;
      try { name = decodeURIComponent(encodedName).toLowerCase(); }
      catch (_) { name = ''; }
      const cat = CATEGORIES.find(c => c.name.toLowerCase() === name);

      if (!cat) {
        document.getElementById('cat-title').textContent = 'Category not found';
        return;
      }

      document.title = `${cat.name} Government Jobs ${new Date().getFullYear()} — Notifications & Deadlines | SarkariJobs+`;
      document.getElementById('cat-title').textContent = `${cat.icon} ${cat.name} Jobs`;
      document.getElementById('cat-desc').textContent = cat.desc + ' — notifications with dates when supplied and source links.';

      const render = jobs => {
        // NEVER fill with other categories — aspirants get misled. Honest empty state instead.
        const own = jobs.filter(j => (!j.type || j.type === 'job') &&
          (j.category || '').toLowerCase() === cat.name.toLowerCase());
        const headingEl = document.getElementById('jobs-heading');
        if (!own.length) {
          headingEl.textContent = `${cat.name} — No notifications in the current feed`;
          document.getElementById('cat-jobs-grid').innerHTML =
            `<p style="color:var(--text-grey); text-align:center; grid-column:1/-1;">
               There are no matching notifications in the available feed right now.<br>
               Meanwhile, check <a href="index.html#jobs" style="color:var(--saffron-dark); font-weight:700;">all notifications</a> across all categories.</p>`;
          return;
        }
        headingEl.textContent = `${cat.name} notifications`;
        const dated = own.filter(j => daysUntil(j.lastDate) !== null && daysUntil(j.lastDate) >= 0)
          .sort((a,b) => String(a.lastDate).localeCompare(String(b.lastDate)));
        const undated = own.filter(j => daysUntil(j.lastDate) === null);
        const expired = own.filter(j => daysUntil(j.lastDate) !== null && daysUntil(j.lastDate) < 0)
          .sort((a,b) => String(b.lastDate).localeCompare(String(a.lastDate)));
        document.getElementById('cat-jobs-grid').innerHTML =
          [...dated, ...undated, ...expired].map(jobCardHTML).join('');
      };

      fetch('data/jobs.json')
        .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
        .then(p => render(p.jobs))
        .catch(() => {
          document.getElementById('jobs-heading').textContent = `${cat.name} notifications unavailable`;
          document.getElementById('cat-jobs-grid').innerHTML =
            '<p style="color:var(--text-grey); text-align:center; grid-column:1/-1;">The notifications feed could not be loaded.</p>';
        });
    }
    document.addEventListener('DOMContentLoaded', renderCategoryPage);
  </script>
</body>
</html>
