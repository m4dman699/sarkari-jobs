name: Deploy website to Hostinger

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Refresh government job feed]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # SFTP is latency-bound: one directory costs about 3.4 s, so 258 directories
    # plus the site files take roughly 21 minutes. A 22-minute upload step left
    # under a minute of slack (run 44570922814 used 20m53s of 22m) and will
    # overrun as the feed grows, which is how the earlier truncation happened.
    timeout-minutes: 45
    env:
      SFTP_REMOTE_DIR: /home/${{ secrets.HOSTINGER_SFTP_USER }}/domains/sarkarijobsplus.com/public_html
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Check out website
        uses: actions/checkout@v5
      - name: Check Hostinger deployment settings
        env:
          SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
        run: |
          for key in SFTP_HOST SFTP_USER SFTP_PASSWORD SFTP_REMOTE_DIR; do
            if [ -z "${!key}" ]; then echo "Missing deployment setting for $key."; exit 1; fi
          done
      - name: Configure Google Analytics when a Measurement ID is available
        env:
          GA4_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: |
          if [ -n "$GA4_ID" ]; then
            if [[ ! "$GA4_ID" =~ ^G-[A-Z0-9]+$ ]]; then echo 'GA4_MEASUREMENT_ID must look like G-XXXXXXXXXX.'; exit 1; fi
            # Replace whatever ID the repository currently carries, not only an
            # empty string: the committed file holds a real ID, so the old
            # empty-only pattern silently kept sending data to the wrong
            # property whenever the secret changed.
            sed -i -E "s/window\.SARKARI_JOBS_GA_ID = '[^']*';/window.SARKARI_JOBS_GA_ID = '$GA4_ID';/" js/analytics-config.js
            grep -q "window.SARKARI_JOBS_GA_ID = '$GA4_ID';" js/analytics-config.js || { echo 'GA4 Measurement ID was not written into analytics-config.js.'; exit 1; }
          fi
      - name: Prepare deployment revision marker
        run: |
          echo "$DEPLOY_SHA" > deployment-version.txt
      - name: Build individual listing pages
        working-directory: scraper
        run: npm ci && npm run build:details
      - name: Stage public website files
        run: |
          mkdir -p .deploy-site
          cp index.html category.html state.html results.html admit-cards.html about.html editorial-policy.html privacy.html contact.html all-jobs.html robots.txt sitemap.xml sitemap-core.xml sitemap-jobs.xml sitemap-results.xml sitemap-admit-cards.xml deployment-version.txt .deploy-site/
          cp -R assets css js data .deploy-site/
          cp -R upsc-cds-2-2026 .deploy-site/
          # Sector guides are generated into guides/ by `npm run build:details`
          # and listed in sitemap.xml. Without this copy they would never reach
          # the server and every /guides/ URL would 404 in production.
          cp -R guides .deploy-site/
          mkdir -p .deploy-shard-a
          mapfile -t detail_dirs < <(find job-details -mindepth 1 -maxdepth 1 -type d | sort)
          for index in "${!detail_dirs[@]}"; do
            if (( index % 2 == 0 )); then cp -R "${detail_dirs[$index]}" .deploy-shard-a/; fi
          done
      - name: Upload only public site files over SFTP
        timeout-minutes: 32
        uses: Dylan700/sftp-upload-action@5108b43b1cd4d60abd1982edb4c7159ece875c44 # v1.2.5
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          uploads: |
            ./.deploy-site/ => ${{ env.SFTP_REMOTE_DIR }}/
            ./.deploy-shard-a/ => ${{ env.SFTP_REMOTE_DIR }}/job-details/
          ignore: |
            *.log
          delete: 'false'

  deploy-detail-shard-b:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SFTP_REMOTE_DIR: /home/${{ secrets.HOSTINGER_SFTP_USER }}/domains/sarkarijobsplus.com/public_html
    steps:
      - name: Check out website
        uses: actions/checkout@v5
      - name: Build individual listing pages
        working-directory: scraper
        run: npm ci && npm run build:details
      - name: Stage second half of detail pages
        run: |
          mkdir -p .deploy-shard-b
          mapfile -t detail_dirs < <(find job-details -mindepth 1 -maxdepth 1 -type d | sort)
          for index in "${!detail_dirs[@]}"; do
            if (( index % 2 == 1 )); then cp -R "${detail_dirs[$index]}" .deploy-shard-b/; fi
          done
      - name: Check Hostinger deployment settings
        env:
          SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
        run: |
          for key in SFTP_HOST SFTP_USER SFTP_PASSWORD SFTP_REMOTE_DIR; do
            if [ -z "${!key}" ]; then echo "Missing deployment setting for $key."; exit 1; fi
          done
      - name: Upload second half of detail pages over SFTP
        timeout-minutes: 32
        uses: Dylan700/sftp-upload-action@5108b43b1cd4d60abd1982edb4c7159ece875c44 # v1.2.5
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          uploads: |
            ./.deploy-shard-b/ => ${{ env.SFTP_REMOTE_DIR }}/job-details/
          ignore: |
            *.log
          delete: 'false'

  verify-public-deployment:
    needs: [deploy, deploy-detail-shard-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Check out website
        uses: actions/checkout@v5
      - name: Check Hostinger revision and listing pages
        run: |
          for attempt in {1..6}; do
            live=$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "https://sarkarijobsplus.com/deployment-version.txt?sha=$DEPLOY_SHA" || true)
            if [ "$live" = "$DEPLOY_SHA" ]; then break; fi
            sleep 5
          done
          if [ "$live" != "$DEPLOY_SHA" ]; then echo 'Public site does not serve this commit after upload.'; exit 1; fi
          feed=$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' 'https://sarkarijobsplus.com/data/jobs.json?verify='"$DEPLOY_SHA")
          total=$(echo "$feed" | jq -r '.total')
          if [ "$total" -lt 300 ]; then echo "Unexpected live feed size: $total"; exit 1; fi
          for f in sitemap.xml data/jobs.json; do
            live=$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "https://sarkarijobsplus.com/$f?verify=$DEPLOY_SHA" | sha256sum | cut -d' ' -f1)
            want=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$live" != "$want" ]; then echo "Live $f does not match this commit."; exit 1; fi
          done
          for page in $(ls -d job-details/*/ | sort | grep -v 'privacy-policy-1f1c4eba' | sed -n '1p;$p'); do
            page=${page%/}
            body=$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "https://sarkarijobsplus.com/$page/index.html?verify=$DEPLOY_SHA")
            if ! echo "$body" | grep -q 'How to use this page'; then echo "Stale or missing detail page: $page"; exit 1; fi
          done
          for page in results.html admit-cards.html; do
            body=$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "https://sarkarijobsplus.com/$page?verify=$DEPLOY_SHA")
            if ! echo "$body" | grep -q 'data-announcement-type'; then echo "Missing all-listings page: $page"; exit 1; fi
          done
          # Sweep every URL the sitemap advertises. Sampling the first and last
          # detail page was not enough: on 19 Nov both SFTP jobs hit their
          # 15-minute cap after deployment-version.txt had already landed, the
          # run failed, and seven tail pages stayed at 404 while a spot check
          # would have passed. A URL that is in the sitemap must answer 200.
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's|</\?loc>||g' | sed "s|\$|?verify=$DEPLOY_SHA|" > /tmp/sitemap-urls.txt
          count=$(wc -l < /tmp/sitemap-urls.txt)
          echo "Checking $count sitemap URLs"
          xargs -P 12 -I{} curl -s -o /dev/null -w '%{http_code} {}\n' --max-time 25 {} < /tmp/sitemap-urls.txt > /tmp/sitemap-codes.txt
          broken=$(awk '$1 != 200' /tmp/sitemap-codes.txt | sort -u)
          if [ -n "$broken" ]; then
            echo "Sitemap URLs that did not answer 200:"
            echo "$broken" | head -40
            exit 1
          fi
          echo "All $count sitemap URLs answer 200."
          echo "Hostinger serves $DEPLOY_SHA byte-identical artifacts, $total feed records, and enriched detail pages on both shards."
