name: Deploy website to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SFTP_REMOTE_DIR: /home/${{ secrets.HOSTINGER_SFTP_USER }}/domains/sarkarijobsplus.com/public_html
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Check Hostinger deployment settings
        env:
          SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
        run: |
          for key in SFTP_HOST SFTP_USER SFTP_PASSWORD SFTP_REMOTE_DIR; do
            if [ -z "${!key}" ]; then echo "Missing deployment setting for $key. Add the matching HOSTINGER_* GitHub Actions secret."; exit 1; fi
          done
      - name: Configure Google Analytics when a Measurement ID is available
        env:
          GA4_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: |
          if [ -n "$GA4_ID" ]; then
            if [[ ! "$GA4_ID" =~ ^G-[A-Z0-9]+$ ]]; then echo 'GA4_MEASUREMENT_ID must look like G-XXXXXXXXXX.'; exit 1; fi
            sed -i "s/window.SARKARI_JOBS_GA_ID = '';$/window.SARKARI_JOBS_GA_ID = '$GA4_ID';/" js/analytics-config.js
          fi
      - name: Prepare deployment revision marker
        run: echo "$GITHUB_SHA" > deployment-version.txt
      - name: Update sitemap page modification dates
        run: sed -i -E "s#<lastmod>[^<]*</lastmod>#<lastmod>$(date -u +%F)</lastmod>#g" sitemap.xml
      - name: Upload site files over SFTP
        uses: Dylan700/sftp-upload-action@5108b43b1cd4d60abd1982edb4c7159ece875c44 # v1.2.5
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          uploads: |
            ./ => ${{ env.SFTP_REMOTE_DIR }}/
          ignore: |
            .git/**
            .github/**
            scraper/**
            .gitignore
            DEPLOYMENT.md
          delete: 'false'
      - name: Verify public site received this commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..12}; do
            live=$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "https://sarkarijobsplus.com/deployment-version.txt?sha=$DEPLOY_SHA" || true)
            if [ "$live" = "$DEPLOY_SHA" ]; then echo "Public site is serving $DEPLOY_SHA"; exit 0; fi
            sleep 5
          done
          echo 'Deployment upload completed, but the public site did not serve this commit marker.'
          exit 1
