name: Refresh government job feed

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-government-job-feed
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci
      - name: Scrape official recruitment portals
        working-directory: scraper
        run: npm run scrape
      - name: Fill feed gaps from competitor listing indexes
        working-directory: scraper
        run: npm run scrape:competitors
      - name: Build individual listing pages
        working-directory: scraper
        run: npm run build:details
      - name: Publish refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json data/states job-details sitemap.xml scraper/competitor-detail-cache.json
          if git diff --cached --quiet; then
            echo 'The scraped feed has no changes.'
          else
            git commit -m 'Refresh government jobs feed'
            git push
          fi
