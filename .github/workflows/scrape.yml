name: Scrape Govt Jobs

on:
  schedule:
    - cron: '0 2 * * *'        # daily at 02:00 UTC (~07:30 IST)
  workflow_dispatch:          # manual run button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: scraper
        run: npm install --omit=dev

      - name: Run scraper
        working-directory: scraper
        run: node scrape.js

      - name: Commit fresh data
        run: |
          git config user.name "sarkari-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || git commit -m "🔄 auto: daily job refresh (central + states)"
          git push
